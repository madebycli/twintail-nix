name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Verify upstream metadata is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/update.py
          python3 scripts/update.py
          git diff --exit-code -- flake.nix
          nix flake update twintail_x86_64 --refresh
          git diff --exit-code -- flake.lock
      - name: Verify lock, check, and build Flake
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs
          nix build .#twintaillauncher --no-write-lock-file --print-build-logs
      - name: Verify runtime fixes and NixOS defaults
        shell: bash
        run: |
          set -euo pipefail
          test -x ./result/bin/twintaillauncher
          grep -Fq 'msvcp140_2.dll_x86' patches/winetricks-vcrun2022-wine11.patch
          grep -Fq 'msvcp140_2.dll_amd64' patches/winetricks-vcrun2022-wine11.patch
          grep -Fq 'winetricks.log' package.nix
          grep -Fq 'SELECT directory FROM install' package.nix
          grep -Fq 'jsproxy.dll' package.nix
          grep -Fq 'PRESSURE_VESSEL_FILESYSTEMS_RO' package.nix
          grep -Fq 'PROTON_DLL_COPY' package.nix
          grep -Fq 'twintaillauncher-xorg-locale' package.nix
          grep -Fq "export GTK_IM_MODULE='xim'" package.nix
          grep -Fq 'hardware.graphics.enable = lib.mkDefault true' flake.nix
          grep -Fq 'hardware.graphics.enable32Bit = lib.mkDefault true' flake.nix
          grep -Fq 'programs.gamemode.enable = lib.mkDefault true' flake.nix
          grep -Fq 'programs.gamescope.enable = lib.mkDefault true' flake.nix
      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/twintail-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#twintaillauncher"
          test -x "$DIRECT_PROFILE/bin/twintaillauncher"
